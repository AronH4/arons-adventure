<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arons Adventure</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Musik-Steuerung oben links -->
  <div class="music-control-container">
    <button id="music-toggle-btn" class="music-toggle-btn muted" title="Hintergrundmusik ein-/ausschalten">
      🔊
    </button>
    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
  </div>

  <audio id="bg-music" style="display: none;"></audio>

  <header>
    <h1>ARONS ADVENTURE</h1>
    <div class="tabs">
      <button class="tab-btn active" data-tab="past">PAST</button>
      <button class="tab-btn" data-tab="current">CURRENT</button>
      <button class="tab-btn" data-tab="upcoming">UPCOMING</button>
    </div>
  </header>

  <main>
    <div id="games-grid" class="games-grid"></div>

    <div id="game-details" class="hidden">
      <!-- Badges / Fortschritt -->
      <div class="badges-container" id="badges-container"></div>

      <div class="bottom-layout">
        <!-- Links: Cover/Map Flip Card (Ohne Ränder) -->
        <div class="side-card-wrapper left">
          <div class="side-card">
            <div id="cover-flip-card" class="flip-card" title="Klicken für Karte / Cover Wechsel">
              <div class="flip-card-inner">
                <div class="flip-card-front">
                  <img id="detail-cover" src="" alt="Cover">
                </div>
                <div class="flip-card-back">
                  <img id="detail-map" src="" alt="Map">
                </div>
              </div>
            </div>
            <div id="detail-region" class="side-card-text"></div>
            <div id="detail-year" class="side-card-text"></div>
            <div id="detail-console-name" class="side-card-text"></div>
          </div>
        </div>

        <!-- Mitte: Team -->
        <div id="team-container" class="team-grid"></div>

        <!-- Rechts: Detail Panel -->
        <div class="side-card-wrapper right">
          <div id="poke-details-panel" class="poke-details-card hidden"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
